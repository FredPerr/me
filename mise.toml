[tools]
node = "24"
pnpm = "12.5.1"
rust = "1.98.1"

[tasks.install]
description = "Install JS dependencies"
run = "pnpm install"

[tasks.dev]
description = "Run the full desktop app with hot reload"
run = "pnpm tauri dev"

[tasks.build]
description = "Type-check and build the frontend"
run = "pnpm build"

[tasks.lint]
description = "Check formatting and lint rules"
run = "pnpm lint"

[tasks.test]
description = "Run the test suite once"
run = "pnpm test"

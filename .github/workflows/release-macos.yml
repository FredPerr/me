name: Release (macOS)

# Publishes a macOS ARM (.dmg) release on every push to main.
# Can also be run manually from the Actions tab.
#
# The patch version is bumped automatically and committed back to main. The
# push is authenticated as a GitHub App (not any individual), so it works no
# matter who merged the PR. The app must be allowed to bypass the "require a
# pull request" branch-protection rule (the default GITHUB_TOKEN cannot).
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos:
    runs-on: macos-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Check out with the app token so the version-bump push is
          # authenticated as the GitHub App (a bypass-allowed actor). This is
          # independent of whoever merged the PR.
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump patch version
        id: version
        run: |
          # Bump package.json patch (no git tag), keep tauri.conf.json in sync.
          NEW_VERSION=$(npm version patch --no-git-tag-version | sed 's/^v//')
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='$NEW_VERSION';require('fs').writeFileSync(f, JSON.stringify(c,null,2)+'\n')"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        env:
          # The app's bot identity, so the commit is attributed to the app.
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json
          # [skip ci] prevents this commit from re-triggering the workflow.
          git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
          # Pushed via the app token from checkout. The app must be allowed to
          # bypass the "require a pull request" branch-protection rule on main.
          git push

      - name: Install toolchain (mise)
        uses: jdx/mise-action@v2

      - name: Add macOS ARM Rust target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin
          tagName: v${{ steps.version.outputs.version }}
          releaseName: "me v${{ steps.version.outputs.version }}"
          # Publish immediately so releases/latest serves latest.json to the updater.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
